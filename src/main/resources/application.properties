spring.application.name=deal_with_devil_CSA

# Database (PostgreSQL via Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/deal_devil}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Game numbers, whole coins. PLACEHOLDERS: replace with the real values once decided.
# Base price = reserve price for a problem; solve reward = preset credit for solving.
game.base-price.bronze=50
game.base-price.silver=100
game.base-price.gold=200
game.solve-reward.bronze=100
game.solve-reward.silver=200
game.solve-reward.gold=400
game.hint-price=30
# Redemption must cost more than the deal pays, or the app will not start.
game.devil.deal-payout=100
game.devil.redemption-cost=150

# Auth. The defaults below are DEV-ONLY placeholders; set the environment variables for anything real.
app.auth.google-client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id.apps.googleusercontent.com}
app.auth.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-before-the-event-0123456789}
app.auth.jwt-expiry-hours=3
# Comma separated. Placeholder emails until the real organisers are known.
app.auth.admin-emails=${ADMIN_EMAILS:admin1@example.com,admin2@example.com}

# CORS: the React dev server origins (Vite and Create React App defaults)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
